services:
  - type: web
    name: mission-architecture-simulator-api
    runtime: python
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python -c "from app.database import init_db; init_db()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mission-architecture-simulator-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000

databases:
  - name: mission-architecture-simulator-db
    plan: free
    region: ohio
    postgresMajorVersion: "15"
